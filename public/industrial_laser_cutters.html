<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industrial Robotics | IntelRobotics</title>
    <link rel="stylesheet" href="css/product.css" />
  </head>
  <body class="product-page" data-category-id="2">
    <header class="product-topbar">
      <a class="product-brand" href="index.html">IntelRobotics</a>
      <nav class="product-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <div class="products-menu">
          <button class="products-toggle" type="button" aria-expanded="false" aria-haspopup="true">
            Products
          </button>
          <div class="products-dropdown">
            <a href="industrial_robotics.html">Industrial robotics</a>
            <a href="logistics.html">Logistics</a>
          </div>
        </div>
        <a href="about-us.html">About us</a>
      </nav>
    </header>


<main>
    <!-- Category hero -->
    <section class="product-hero" aria-labelledby="category-title">

        <div class="product-art product-art-hand">
            <img id="category-image" alt="" hidden />
        </div>

        <div class="product-intro">

            <span class="product-kicker" id="category-kicker"></span>

            <h1 id="category-title"></h1>

            <p class="product-price" id="category-price" hidden>
                Price from <strong id="category-min-price"></strong>
            </p>

            <p id="category-description"></p>

            <a class="product-link" href="#robot-models">
                View models <span aria-hidden="true">&#8595;</span>
            </a>

        </div>
    </section>


    <!-- Individual products -->
    <section class="model-section" id="robot-models">

        <div class="model-heading">

            <span class="product-kicker">
                Choose your automation setup
            </span>

            <h2 id="models-heading"></h2>

        </div>

        <div class="pricing-grid" id="product-grid">

            <p>Loading products...</p>

        </div>

    </section>

</main>


    <script src="js/main.js"></script>
    <script src="js/product-page.js"></script>
</body>
</html>
